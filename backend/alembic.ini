# ============================================================
# Alembic 配置
# 安装位置（发布包内）: /opt/selftool/app/current/alembic.ini
# 数据库 URL 不写在这里 —— 由 migrations/env.py 从环境变量读取
#（docs/01 FR-CFG-05：密钥与连接串只走环境变量）
# ============================================================
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 迁移文件名带序号前缀，保证执行顺序与阅读顺序一致
file_template = %%(rev)s_%%(slug)s
# 时区用于生成 revision 时间戳
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
