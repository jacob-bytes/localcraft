# ============================================================
# /etc/nginx/conf.d/localcraft.conf
# 用途：内网 IP + HTTP **快速验证版**（M1）
#       打通链路后再换成生产 TLS 版本（docs/05 §7.3）
# 来源：docs/05《部署与运维方案》§7.2
# 验证：nginx -t && systemctl reload nginx
# ------------------------------------------------------------
# 本文件整体被 include 进 nginx.conf 的 `http {}` 块
# （conf.d/*.conf 默认即被 include），所以下面这些 http 级指令
# 可以直接写在这里，不必再拆一个 localcraft-limits.conf。
# ============================================================

# ---------- WebSocket 升级头映射 ----------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 限流 zone（M1 只定义不启用，供 M2 打开）----------
# 登录接口按 IP 限速，防止口令爆破
limit_req_zone $binary_remote_addr zone=localcraft_login:10m rate=10r/m;
# 通用 API 限速：每人每分钟 600 次请求
limit_req_zone $binary_remote_addr zone=localcraft_api:10m   rate=600r/m;
# 并发连接限制：单 IP 最多 64 个并发连接
limit_conn_zone $binary_remote_addr zone=localcraft_conn:10m;

# ---------- 日志格式 ----------
log_format localcraft_main '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time uct=$upstream_connect_time '
                         'uht=$upstream_header_time urt=$upstream_response_time';

# ---------- 上游（keepalive 连接池 + 失败摘除）----------
upstream localcraft_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    # 快速验证阶段监听所有网卡的 80 端口。
    # 收紧时改成内网地址，例如： listen 10.0.0.10:80;
    listen       80 default_server;
    server_name  _;

    # 关闭版本号泄露
    server_tokens off;

    # 上传大小上限：必须大于应用侧 200 MB。512m 为 multipart 开销留足余量
    client_max_body_size 512m;
    # 客户端请求体超时（大文件上传）
    client_body_timeout   300s;
    client_header_timeout 30s;

    access_log /var/log/nginx/localcraft.access.log localcraft_main;
    error_log  /var/log/nginx/localcraft.error.log warn;

    # ---------- 健康检查：不写访问日志，便于监控高频探测 ----------
    location = /healthz {
        access_log off;
        proxy_pass http://localcraft_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://localcraft_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ---------- 前端静态产物：带内容哈希，可长缓存 ----------
    location /assets/ {
        proxy_pass http://localcraft_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 其余请求统一转给 FastAPI（含前端 SPA fallback）----------
    # 后端的 SPA fallback 会把非 /api 路径回退到 index.html（docs/03 §6.5），
    # 所以 nginx 侧不需要 try_files，保持单一事实来源。
    location / {
        proxy_pass         http://localcraft_backend;
        # 传递真实客户端信息；应用侧开启 --proxy-headers 后据此记录 IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # 请求追踪：客户端传的 X-Request-Id 原样透传，缺失由后端生成
        proxy_set_header   X-Request-Id      $http_x_request_id;
        # HTTP/1.1 以支持 keepalive 与 chunked
        proxy_http_version 1.1;
        proxy_set_header   Connection        $connection_upgrade;

        # 超时：大文件上传/下载需要较长窗口
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 上传路径不缓冲，让数据流式进入应用
        client_body_buffer_size 1m;

        # 后端重启期间返回 502 时，nginx 自动重试下一个上游
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ---------- 安全响应头（HTTP 版也加上，便于前端联调时发现缺失）----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
