# ============================================================
# selftool.service 的 systemd drop-in —— 加固与资源上限
#
# 用途：把"资源上限 + 安全加固"从主单元里拆出来单独维护，
#       这样主单元（selftool.service）保持"启动命令与重启策略"的单一职责，
#       调上限时不必改动主单元文件。
# 依据：docs/05《部署与运维方案》§6.2（资源限制 / 安全加固小节）
#       §6.5（为什么 LimitNOFILE 必须调高）
#
# 安装位置（**必须是 drop-in 目录，不能是别处**）：
#     /etc/systemd/system/selftool.service.d/limits.conf
# 权限：0644 root:root
# 发布包内路径：deploy/systemd/selftool.service.d/limits.conf
#
# 为什么是 drop-in 而不是"被 include 的片段"：
#     systemd 的 unit 文件**不支持** C 语言式的 `include`。
#     `EnvironmentFile=` 虽然名字像 include，但它只解析 KEY=VALUE 环境变量，
#     不会把 `[Service]` 段合并进 unit。
#     systemd 唯一的"片段合并"机制就是 drop-in 目录：
#     安装到 <unit>.d/*.conf 后，`systemctl daemon-reload` 会自动叠加。
#     drop-in 里的同名键**覆盖**主单元里的值（后加载者胜）。
#
# 生效：systemctl daemon-reload && systemctl restart selftool.service
# 校验：systemctl show selftool.service -p LimitNOFILE -p LimitNPROC -p MemoryMax
#       pid=$(systemctl show -p MainPID --value selftool.service); cat "/proc/$pid/limits"
# 卸载：删除本文件后 systemctl daemon-reload（scripts/uninstall.sh 会一并删除）
# ============================================================

[Service]
# ---------- 文件描述符 ----------
# docs/05 §6.5：每个 HTTP 连接、每个正在 sendfile 的大文件下载都占一个 fd。
# 100 并发用户 × 浏览器 6 条并行连接就可能数百个 socket fd，再加上
# SQLite 的 db/-wal/-shm 三个 fd、连接池、日志 fd，默认 1024 在下载高峰
# 会直接 EMFILE（"Too many open files"）。
LimitNOFILE=65536

# ---------- 进程/线程数 ----------
# 同步驱动的线程池 + 可能存在的线程后端需要较多线程。
# 注意：LimitNPROC 是**每用户**的进程上限，而 selftool 用户是专用系统用户，
# 没有其它进程，所以这里给的是该用户的总预算。
LimitNPROC=8192

# 不给 core dump：崩溃现场靠 journal，core 文件动辄几百 MB 且可能含密钥。
LimitCORE=0

# ---------- 内存 ----------
# 百人规模 2G 足够；MemoryHigh 是"软限"，先回收再 OOM，
# MemoryMax 是硬限，超过直接 OOM kill（由 systemd 记录并可被监控发现）。
# 若目标机内存紧张，请同步下调 selftool.slice 的 MemoryMax，避免 slice 上限小于单元上限。
MemoryHigh=1536M
MemoryMax=2G
# 用 swap 的意愿：0 表示尽量不用 swap（避免大文件下载时的页面抖动）
MemorySwapMax=0

# ---------- CPU ----------
# 权重是相对值，只在同机存在 CPU 竞争时起作用（与 slice 的 CPUQuota 互补）
CPUWeight=200
# 允许使用的 CPU 时间占比上限（400% = 4 个核），防止单服务打满整机
CPUQuota=400%

# ---------- 任务数上限 ----------
# 与 slice 的 TasksMax 保持同量级；slice 的 8192 是整组上限，这里 4096 给主服务
TasksMax=4096

# ---------- 安全加固（此处再显式声明一遍，便于用 systemd-analyze security 审计）----------
# 主单元里已有，重复声明不会有害，且能保证"只装 drop-in 的极限场景"下也生效。
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelLogs=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# ProtectSystem=strict 让整个文件系统只读，必须显式放开服务要写的路径，
# 否则应用启动即 EROFS 失败。
ReadWritePaths=/var/lib/selftool /var/log/selftool
