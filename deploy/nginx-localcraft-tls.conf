# ============================================================
# localcraft nginx 生产配置（TLS + 反向代理 + SPA try_files）
#
# 用途：生产环境入口。80 只做跳转与 ACME 预留，443 承载全部业务。
# 依据：docs/05《部署与运维方案》
#         §7.3  生产 TLS 版全文（本文件的主体）
#         §7.5  可选加速形态 —— nginx 直接托管 dist + try_files 回退
#               （本文件采用该形态，因此显式包含 try_files，见下方说明）
#         contracts/CONTRACT.md §14.4（等价于 docs 侧 CSP 裁定）：
#               内联主题脚本用 sha256 放行，不用 nonce
# 安装位置：/etc/nginx/conf.d/localcraft.conf
# 权限：0644 root:root
# 发布包内路径：deploy/nginx/localcraft.conf
#
# 前置条件（缺一不可）：
#   1) 证书已放到 /etc/localcraft/tls/localcraft.crt 与 /etc/localcraft/tls/localcraft.key
#      （权限 0640 root:root，见 docs/05 §13.1）
#   2) 必须先安装 localcraft-limits.conf —— 本文件用到它定义的
#      $connection_upgrade / localcraft_login / localcraft_api / localcraft_conn /
#      localcraft_main，缺了 nginx -t 直接失败
#   3) 必须删除 HTTP 快速验证版 /etc/nginx/conf.d/localcraft-http.conf，
#      否则同名 zone / log_format / upstream 会重复定义
#   4) nginx 运行用户需对 /opt/localcraft/app/current/web/dist 有读+执行权限
#      （/opt/localcraft 是 0755，满足）；SELinux Enforcing 时还要打
#      httpd_sys_content_t 标签，见 docs/05 §12.7
#
# 验证：nginx -t && systemctl reload nginx
#
# 与文档 §7.3 的差异（只有一处，且是刻意选择）：
#   §7.3 默认把 SPA/静态资源也转给 FastAPI，因此不需要 try_files；
#   §7.5 提供了"nginx 直服 dist"的加速形态。本文件按 §7.5 加速形态实现，
#   以便用 try_files 承担 SPA 回退（少一次 Python 往返，且 nginx 侧可缓存）。
#   代价：升级时必须整包切换 current 软链，不能让新旧 dist 混用。
# ============================================================

# ---------- HTTP：只做跳转与 ACME 预留 ----------
server {
    # 若目标机没有 IPv6，请删掉下面这一行（listen [::]:80;），
    # 否则 nginx 会因 "socket() [::]:80 failed (97: Address family not supported)" 启动失败。
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name localcraft.intra.example.com;

    server_tokens off;

    # ACME 证书校验路径预留（用内网 CA 签发时可整段删除）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # 健康检查允许走 HTTP：内网监控不校验证书也能探测存活
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # 其余全部跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    # http2 on; 需要 nginx >= 1.25.1。
    # 若目标机 nginx 更旧（如 openEuler 自带的 1.24.x），改写为：
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    # 并删除下面这一行。
    http2       on;
    server_name localcraft.intra.example.com;

    server_tokens off;

    # ---------- 证书 ----------
    ssl_certificate     /etc/localcraft/tls/localcraft.crt;
    ssl_certificate_key /etc/localcraft/tls/localcraft.key;

    # 会话复用：降低 TLS 握手开销（百人规模下差别明显）
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1h;
    # 关闭 session ticket：内网自签/内网 CA 场景下没有轮换密钥的机制，
    # 长期固定的 ticket key 反而削弱前向保密。
    ssl_session_tickets off;

    # 只允许 TLS 1.2 / 1.3
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # OCSP stapling：使用内网 CA 时通常不可用，默认注释。
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/localcraft/tls/ca-chain.crt;

    # HSTS：确认所有客户端都走 HTTPS 后再启用。首次启用建议先用短 max-age（如 300）
    # 试运行，确认无 HTTP 依赖后再加长，否则一旦出错浏览器会长时间拒绝回退。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 请求体与超时 ----------
    # 必须大于应用侧 200 MB 上限；512m 为 multipart 编码与边界留余量。
    # 若上传 location 里另写 client_max_body_size，会覆盖这里的值。
    client_max_body_size  512m;
    client_body_timeout   300s;
    client_header_timeout 30s;
    client_body_buffer_size 1m;
    send_timeout          600s;

    # 大文件上传时不让 nginx 先落临时文件（省磁盘、首字节更快）。
    # 仅当上游读得足够快时才该关闭缓冲；本应用是流式写盘，满足条件。
    proxy_request_buffering off;
    # 大文件下载边收边发，避免 nginx 缓冲整个响应体
    proxy_buffering off;

    # ---------- 日志 ----------
    access_log /var/log/nginx/localcraft.access.log localcraft_main;
    error_log  /var/log/nginx/localcraft.error.log warn;

    # ---------- 单 IP 并发连接上限 ----------
    limit_conn localcraft_conn 64;

    # ---------- 安全响应头 ----------
    # ⚠ nginx 的 add_header 是"全有或全无"：只要某个 location 自己写了任意一条
    #   add_header，就会完全丢失 server 级的这批头。因此下面每个"自带 add_header"
    #   的 location 里都重复了一遍，不要以为可以省。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # CSP：内网平台不需要任何外部资源。
    # script-src 里的 sha256 是前端内联主题脚本（web/index.html 内联 <script>）的
    # 内容哈希 —— 契约 §14.4 裁定用 sha256 而非 nonce（dist/index.html 是静态文件，
    # 无法携带每请求 nonce）。改动该内联脚本后必须同步更新这个哈希，否则主题脚本被拦、
    # 首屏会闪白（拿哈希：grep -A20 '<script>' web/dist/index.html 后按 <script> 内容算 sha256）。
        # ⚠ 上面 script-src 里的 sha256 必须与 web/dist/index.html 的内联主题脚本一致。
        #   nginx 直接读盘发 HTML（root + try_files），不经过应用，所以这条只能写死；
        #   而写死就会过期 —— 曾经真的过期过（记的是 sIS7ps8… 而实际是 mYPiuzMI…），
        #   后果是浏览器拦掉内联脚本、主题闪烁。
        #   改前端内联脚本后，用 `pytest tests/test_security_headers.py -k nginx` 校验。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-mYPiuzMIfPvMwrHpbRsc2iNjKDRwSn5hn45A1jbNJss='; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---------- SPA 静态产物根目录（§7.5 加速形态）----------
    # current 是软链，指向 releases/<version>；升级时整体切换，nginx 无需 reload。
    root /opt/localcraft/app/current/web/dist;

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        access_log off;
        # 只允许本机与内网监控网段探测，避免把内部状态暴露给普通用户
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ---------- 带内容哈希的静态资源：长缓存，nginx 直服 ----------
    # Vite 产物形如 /assets/index-a1b2c3d4.js，内容变则文件名变，可安全长缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        # 该 location 有自己的 add_header，故重复 server 级安全头（见上方说明）
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-mYPiuzMIfPvMwrHpbRsc2iNjKDRwSn5hn45A1jbNJss='; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        access_log off;
    }

    # ---------- 图片资源：中等缓存（走应用，因为要校验签名 URL）----------
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-mYPiuzMIfPvMwrHpbRsc2iNjKDRwSn5hn45A1jbNJss='; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # ---------- 登录接口：严格限流，防口令爆破 ----------
    location = /api/v1/auth/login {
        limit_req zone=localcraft_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 登录请求体很小，单独收紧，避免这条路径被当成上传通道
        client_max_body_size 1m;
    }

    # ---------- 上传接口：长超时、不缓冲、不压缩 ----------
    location ^~ /api/v1/files/upload {
        limit_req zone=localcraft_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 上传不压缩：zip/whl 已压缩，再压只耗 CPU
        gzip off;
    }

    # ---------- 下载接口：长超时、支持 Range、不缓冲 ----------
    location ^~ /api/v1/files/download {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 不缓冲响应，让应用侧 FileResponse 的 sendfile 路径直接生效
        proxy_buffering off;
        # 透传 Range 相关头，断点续传与 206 才能正常工作
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
        # 大文件下载可能持续很久；注意该超时是"两次读之间的间隔"，不是总时长
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
        gzip off;
    }

    # ---------- 其他 API ----------
    location ^~ /api/ {
        limit_req zone=localcraft_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 请求追踪：客户端传的 X-Request-Id 原样透传，缺失由后端生成
        proxy_set_header X-Request-Id      $http_x_request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---------- WebSocket / SSE 预留 ----------
    # 若将来引入实时进度推送，走此路径。长连接必须调大读取超时，
    # 否则 60 秒空闲即被 nginx 断开。
    location ^~ /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE 必须不缓冲，否则事件被攒着不发
        proxy_buffering off;
        gzip off;
    }

    # ---------- SPA 入口：先找真实文件，找不到回退 index.html ----------
    # 这是 §7.5 加速形态的核心：/tools/123 这类前端路由没有对应文件，
    # try_files 回退到 index.html，由前端路由接管。
    # API 前缀已由上面的 ^~ /api/ 拦走，所以不会把 404 的 JSON 请求喂成 HTML。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不能长缓存：否则新版本发布后用户仍加载旧入口，
    # 旧入口引用的带哈希 assets 已被删除，页面直接白屏。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-mYPiuzMIfPvMwrHpbRsc2iNjKDRwSn5hn45A1jbNJss='; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # ---------- 兜底：禁止访问隐藏文件 ----------
    # 例外 .well-known（ACME / 将来可能的其它标准路径）
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
