# ============================================================
# selftool nginx 全局片段 —— 限流 / 连接数 / 日志格式 / 高效发送
#
# 用途：http 块级的 `map` / `limit_*_zone` / `log_format` 与传输层调优。
# 依据：docs/05《部署与运维方案》§7.2（限流与连接数 zone 定义）
# 安装位置：/etc/nginx/conf.d/selftool-limits.conf
# 权限：0644 root:root
# 生效：nginx -t && systemctl reload nginx
# 发布包内路径：deploy/nginx/selftool-limits.conf
# ------------------------------------------------------------
# 为什么必须单独成一个文件：`map`、`limit_req_zone`、`limit_conn_zone`、
# `log_format` 只能出现在 `http {}` 上下文里，写进 `server {}` 会直接报
# "directive is not allowed here"。conf.d/*.conf 默认被 include 进 http 块，
# 所以放这里就等于放进了 http 块。
#
# ⚠ 与 selftool-http.conf 互斥（重要）：
#   HTTP 快速验证版（deploy/nginx/selftool-http.conf）**自带一份**同名的
#   map / zone / log_format —— 它是给"只装一个文件就能跑"的现场准备的。
#   两者同时安装会让 nginx 报 "duplicate zone" / "duplicate log format"
#   而启动失败。因此：
#     - HTTP 快速验证阶段：只装 selftool-http.conf，不要装本文件；
#     - 生产 TLS 阶段：装 selftool.conf（TLS）+ 本文件，
#       并先删除 /etc/nginx/conf.d/selftool-http.conf。
#
# ⚠ 本文件里**没有** `upstream selftool_backend`：upstream 块若在两个文件里
#   各定义一次也会报 "duplicate upstream"。TLS 版直接用 127.0.0.1:8000，
#   快速验证版自己在文件内定义 upstream，两边不会打架。
# ============================================================

# ---------- WebSocket / SSE 升级头映射 ----------
# 普通请求必须发空串（而不是 close），否则 HTTP/1.1 keepalive 长连接会被上游断开；
# 升级请求发 upgrade，由后端/代理完成协议切换。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 限流 zone ----------
# 登录接口按客户端 IP 限速：10 次/分钟。这是防口令爆破的最后一道闸门，
# 与后端 security.login_max_failures / lockout_minutes 是互补关系（前者挡频率，后者挡次数）。
limit_req_zone $binary_remote_addr zone=selftool_login:10m rate=10r/m;
# 通用 API 限速：每人每分钟 600 次请求。取 10r/s，正常交互式使用远达不到。
limit_req_zone $binary_remote_addr zone=selftool_api:10m   rate=600r/m;
# 并发连接数：单 IP 最多 64 个。浏览器对同域名约 6 条并行连接 × 多标签页，
# 64 足够正常使用，又能挡住"单机开一堆连接拖垮服务"的情况。
limit_conn_zone $binary_remote_addr zone=selftool_conn:10m;

# ---------- 日志格式 ----------
# 带上游三段耗时：rt=总时间 uct=建连 uht=首字节 urt=上游响应。
# 排障时能一眼看出"慢在 nginx 还是慢在应用"，不用再猜。
log_format selftool_main '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time uct=$upstream_connect_time '
                         'uht=$upstream_header_time urt=$upstream_response_time';

# ---------- 单 worker 文件描述符上限 ----------
# docs/05 §6.5：下载高峰时每个连接占一个 fd。必须与 selftool.service 的
# LimitNOFILE=65536 同一口径，否则瓶颈只是从应用转移到 nginx，
# 报错会从应用变成 nginx 的 "Too many open files"。
worker_rlimit_nofile 65536;

# ---------- 高效文件发送（大文件下载的关键）----------
# sendfile 走内核零拷贝；tcp_nopush 让响应头与首批数据同包发出；
# tcp_nodelay 保证小响应不被 Nagle 算法延迟。
sendfile    on;
tcp_nopush  on;
tcp_nodelay on;

# ---------- 连接复用 ----------
keepalive_timeout  65;
keepalive_requests 1000;

# ---------- 隐藏版本号 ----------
server_tokens off;

# ---------- gzip ----------
# 只压文本类。zip/whl/图片本身已压缩，再压没有收益且白耗 CPU。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss image/svg+xml;
