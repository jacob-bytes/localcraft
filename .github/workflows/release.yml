name: Release

# 推 tag 即发 Release。
#
# 设计取舍（都是踩过坑之后定的）：
#
# 1) 用 Actions 而不是手工点网页：Release 是 REST API 对象，git 协议调不了它。
#    任何人只要能推 tag 就该能发版，不该依赖某人的浏览器会话或一枚长期 PAT。
#    用 runner 内置的 GITHUB_TOKEN，不引入任何 secret。
#
# 2) 全部用 curl + 显式 HTTP 状态码，不用 gh 子命令。gh 的退出码在本项目坑了两次：
#      - `if gh release view` 把 404 与网络错误混为一谈；
#      - 同一仓库同一 tag，本机 gh 2.101.0 返回 rc=1，CI 上返回 rc=0，
#        导致判重误判「已存在」、步骤全跳过、job 报 success 而 Release 是 0 个。
#    HTTP 状态码没有歧义：201 建成功、200 改成功、403 没权限、404 不存在。
#
# 3) **不 checkout**，tag 注释从 API 取。原先用 `git tag -l --format='%(contents)'`，
#    而 actions/checkout 默认不取 annotated tag 对象（fetch-tags 默认 false），
#    显式置 true 也没带下来 —— 于是 %(contents) **静默**退化成提交信息，
#    Release 标题变成提交标题而 job 一切正常。API 里 ref 的 `object.type`
#    明确区分 annotated（tag）与轻量（commit），没有静默退化这回事。
#
# 4) 失败时把 HTTP 码与响应体打进 ::error::。
#    实测：`::notice::` 在**成功的**运行里根本不会保留成 annotation（我的多条
#    notice 一条都没出现），所以诊断只能走 ::error:: 或运行页可见的输出。
#    （曾经写过「job 日志要 admin 才能拉」——那是错的，见 ci.yml 里的勘误说明。）

on:
  push:
    tags: ["v*"]

# GITHUB_TOKEN 默认只读，创建 Release 必须显式提权。
# 注意这只是「申请」：若仓库 Settings → Actions → General → Workflow permissions
# 被锁成只读，那才是硬上限，这里救不了 —— 预检会明确指出这一点。
permissions:
  contents: write

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 创建或更新 Release（数据全部来自 API）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")
          TAG="${GITHUB_REF_NAME}"

          #: 失败时把所有现场塞进**一条** ::error:: —— 这是唯一可靠的对外通道。
          #: 多条 notice 在成功的运行里会被丢弃，试过了。
          fail() {
            echo "::error::${1//$'\n'/%0A}"
            exit 1
          }

          echo "tag=${TAG} repo=${GITHUB_REPOSITORY}"

          # --- 1. 判重 ------------------------------------------------------
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" \
                    "${API}/releases/tags/${TAG}")"
          case "$CODE" in
            200) MODE="update" ;;
            404) MODE="create" ;;
            *)   fail "判重 GET /releases/tags/${TAG} 返回 ${CODE}（期望 200/404），不敢继续。" ;;
          esac
          echo "判重 HTTP ${CODE} → ${MODE}"

          # --- 2. 取 tag 注释（走 API，零本地 git 依赖）----------------------
          REF="$(curl -sS "${AUTH[@]}" "${API}/git/ref/tags/${TAG}")"
          OBJ_TYPE="$(printf '%s' "$REF" | jq -r '.object.type // empty')"
          OBJ_SHA="$(printf '%s' "$REF" | jq -r '.object.sha // empty')"
          echo "tag ref: type=${OBJ_TYPE} sha=${OBJ_SHA:0:7}"

          NOTES="$RUNNER_TEMP/notes.md"
          if [ "$OBJ_TYPE" = "tag" ]; then
            curl -sS "${AUTH[@]}" "${API}/git/tags/${OBJ_SHA}" \
              | jq -r '.message // empty' > "$NOTES"
            echo "已取到 annotated tag 注释（$(wc -l < "$NOTES" | tr -d ' ') 行）"
          elif [ "$OBJ_TYPE" = "commit" ]; then
            curl -sS "${AUTH[@]}" "${API}/commits/${OBJ_SHA}" \
              | jq -r '.commit.message // empty' > "$NOTES"
            echo "注意：这是轻量 tag（type=commit），正文退化为提交信息。建议用 git tag -a。"
          else
            fail "无法解析 tag ref：type=${OBJ_TYPE}。原始响应：$(printf '%s' "$REF" | head -c 500)"
          fi

          TITLE="$(grep -m1 -v '^[[:space:]]*$' "$NOTES" || true)"
          [ -n "$TITLE" ] || TITLE="localcraft ${TAG}"
          tail -n +2 "$NOTES" | sed '/./,$!d' > "$RUNNER_TEMP/body.md"
          [ -s "$RUNNER_TEMP/body.md" ] || printf '%s\n' "$TITLE" > "$RUNNER_TEMP/body.md"
          echo "标题=${TITLE}；正文 $(wc -l < "$RUNNER_TEMP/body.md" | tr -d ' ') 行"

          # --- 3. 写权限预检 -------------------------------------------------
          # 直接试写一个 blob。`GET /actions/permissions/workflow` 需要 admin、
          # 读不到；「能不能写」只有真写一次才可靠。探针 blob 未被引用，会被回收。
          PROBE="$(curl -sS -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' "${AUTH[@]}" \
            -X POST "${API}/git/blobs" -d '{"content":"cHJvYmU=","encoding":"utf-8"}')"
          if [ "$PROBE" != "201" ]; then
            fail "GITHUB_TOKEN 无写权限（POST /git/blobs → ${PROBE}）。响应：$(head -c 300 "$RUNNER_TEMP/probe.json")
          修法：仓库 Settings → Actions → General → Workflow permissions 选 “Read and write permissions” 后重跑。这一步需要仓库 admin，workflow 里的 permissions: 越不过它。"
          fi
          echo "写权限预检通过（HTTP 201）"

          # --- 4. 创建或更新 --------------------------------------------------
          jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body "$RUNNER_TEMP/body.md" \
                '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' \
            > "$RUNNER_TEMP/payload.json"

          if [ "$MODE" = "update" ]; then
            REL_ID="$(curl -sS "${AUTH[@]}" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')"
            [ -n "$REL_ID" ] || fail "判定为 update，但取不到 release id。"
            # tag_name 不允许在 PATCH 中修改
            jq 'del(.tag_name)' "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/patch.json"
            METHOD="PATCH"; ENDPOINT="${API}/releases/${REL_ID}"; EXPECT=200
            PAYLOAD="$RUNNER_TEMP/patch.json"
          else
            METHOD="POST"; ENDPOINT="${API}/releases"; EXPECT=201
            PAYLOAD="$RUNNER_TEMP/payload.json"
          fi

          RES="$(curl -sS -o "$RUNNER_TEMP/result.json" -w '%{http_code}' "${AUTH[@]}" \
            -X "$METHOD" "$ENDPOINT" -d @"$PAYLOAD")"
          if [ "$RES" != "$EXPECT" ]; then
            fail "${METHOD} /releases 返回 ${RES}（期望 ${EXPECT}）。响应：$(head -c 600 "$RUNNER_TEMP/result.json")"
          fi

          URL="$(jq -r '.html_url // empty' "$RUNNER_TEMP/result.json")"
          echo "✅ ${MODE} 完成：${URL}"
          echo "标题：$(jq -r '.name // empty' "$RUNNER_TEMP/result.json")"

      # -----------------------------------------------------------------------
      # 刻意**不**附离线发布包。
      #
      # 本项目的离线 wheelhouse 必须在**与目标机同版本同架构的 openEuler 构建机**
      # 上产出（README D31）。ubuntu runner 上产出的东西不满足这条约束，
      # 附上来反而会让人以为可以直接拿去装。发布包由构建机产出后手工上传。
      # -----------------------------------------------------------------------
